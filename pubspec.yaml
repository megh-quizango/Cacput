name: capcut2
description: "A pixel-perfect, fully functional replica of CapCut Video Editor"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.3
  google_mobile_ads: ^9.2.0
  connectivity_plus: ^7.3.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  firebase_core: ^5.1.0
  firebase_remote_config: ^7.0.1
  firebase_analytics: ^13.0.1
  firebase_crashlytics: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/
